name: Build and verify Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: Sign release APK
        run: |
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/gatefront-build.jks" \
            -storepass gatefront-build -keypass gatefront-build -alias gatefront \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Gatefront, OU=Android, O=Gatefront, L=Gorey, C=IE"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/gatefront-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/gatefront-build.jks" \
            --ks-pass pass:gatefront-build \
            --key-pass pass:gatefront-build \
            --out "$SIGNED" "$RUNNER_TEMP/gatefront-aligned.apk"

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -f "$APK"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Gatefront-0.6.1-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
